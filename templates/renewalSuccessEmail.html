<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Renewal Confirmation</title>
  </head>
  <body>
    <div style="font-family: Arial, Helvetica, sans-serif; line-height:1.4;">
      <h2>Your Policy Renewal is Successful</h2>
      <p>Hi {{userName}},</p>
      <p>Thank you. Your policy <strong>{{policyNumber}}</strong> was renewed on <strong>{{renewalDate}}</strong>.</p>
      <p>Your new expiry date is <strong>{{newExpiryDate}}</strong>.</p>
      <p>If you have any questions, reply to this email or contact support.</p>
      <p>— InsureMithra Team</p>
    </div>
  </body>
 </html>
