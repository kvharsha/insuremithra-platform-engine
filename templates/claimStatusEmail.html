<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claim Status Update</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #333;">
    <div style="max-width:600px;margin:0 auto;padding:20px;border:1px solid #eee;border-radius:6px;background:#fff;">
      <h2 style="color:#2E7D32;">Claim Status Update</h2>
      <p>Hi,</p>
      <p>Your claim <strong>${claimId}</strong> status has been updated to <strong>${status}</strong> on ${date}.</p>
      <p style="margin-top:12px;">You can view the claim details by signing into your account and navigating to the Claims section.</p>
      <p style="margin-top:20px;color:#777;font-size:12px;">If you have questions, reply to this email or contact support.</p>
      <hr />
      <p style="font-size:11px;color:#999;">InsureMithra • Automated notification</p>
    </div>
  </body>
</html>
