name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend deps
        run: |
          npm ci

      - name: Install frontend deps
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm cache clean --force || true
          npm ci || npm install

      - uses: actions/setup-python@v5
        if: hashFiles('**/requirements.txt') != ''
        with:
          python-version: "3.11"

  test:
    name: Test (unit + integration + system)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend deps
        run: npm ci

      - name: Install frontend deps
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm cache clean --force || true
          npm ci || npm install

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@v1
        with:
          mongodb-version: '6.0'

      - name: Run backend tests
        env:
          MONGODB_URI: mongodb://localhost:27017/ci_test
          NODE_ENV: test
        run: |
          npm run test:ci

      - name: Run frontend tests
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          CI: "true"
        # Create junit output using CRA's test runner; disable watch mode for CI
        run: npm test -- --watchAll=false --reporters=default --reporters=jest-junit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            reports/junit/**/*.xml
            frontend/reports/junit/**/*.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage (>= 70% gate)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install backend deps
        run: npm ci
      - name: Install frontend deps
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm cache clean --force || true
          npm ci || npm install

      - name: Start MongoDB for coverage
        uses: supercharge/mongodb-github-action@v1
        with:
          mongodb-version: '6.0'

      - name: Generate backend coverage (NYC)
        env:
          MONGODB_URI: mongodb://localhost:27017/ci_test
          NODE_ENV: test
        run: npm run coverage:backend

      - name: Generate frontend coverage (CRA)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          CI: "true"
        # CRA exposes coverage through `npm test -- --coverage`
        run: npm run test:ci

      - name: Enforce combined threshold 70%
        shell: bash
        run: |
          echo "--- debug: coverage directories ---"
          ls -la coverage || true
          ls -la frontend/coverage || true
          echo "--- debug: coverage/coverage-summary.json (if present) ---"
          if [ -f coverage/coverage-summary.json ]; then head -n 200 coverage/coverage-summary.json; else echo "no backend summary"; fi
          echo "--- debug: frontend/coverage/coverage-summary.json (if present) ---"
          if [ -f frontend/coverage/coverage-summary.json ]; then head -n 200 frontend/coverage/coverage-summary.json; else echo "no frontend summary"; fi
          echo "--- running threshold check ---"
          node scripts/check-coverage-threshold.mjs 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            frontend/coverage/
            reports/coverage-summary.json
          if-no-files-found: error

  lint:
    name: Lint (pylint >=7.5, ESLint 0 errors <10 warnings)
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install backend deps
        run: npm ci
      - name: Install frontend deps
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm cache clean --force || true
          npm ci || npm install

      - uses: actions/setup-python@v5
        if: hashFiles('**/*.py') != ''
        with:
          python-version: "3.11"
      - name: Install Python linters
        if: hashFiles('**/*.py') != ''
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run ESLint (JSON report)
        run: npm run lint:ci

      - name: Frontend lint via CI build (fails on warnings)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm run build

      - name: Run pylint with score gate
        if: hashFiles('**/*.py') != ''
        run: |
          pylint $(git ls-files '*.py') --output-format=text | tee reports/pylint.txt
          python scripts/enforce-pylint-threshold.py reports/pylint.txt 7.5

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            reports/eslint.json
            reports/eslint-summary.txt
            reports/pylint.txt
          if-no-files-found: ignore

  security:
    name: Security (Bandit/Safety/npm audit/Secrets)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install deps
        run: npm ci
        
      - name: npm audit backend (high+)
        run: |
          npm audit --audit-level=high --json | tee reports/npm-audit.json
          node scripts/fail-on-npm-audit.mjs reports/npm-audit.json

      - name: Install frontend deps for audit
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm cache clean --force || true
          npm ci || npm install

      - name: npm audit frontend (moderate+)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          mkdir -p ../reports
          npm audit --audit-level=moderate --json | tee ../reports/frontend-npm-audit.json || echo "Frontend has vulnerabilities - review required"

      - uses: actions/setup-python@v5
        if: hashFiles('**/requirements.txt') != ''
        with:
          python-version: "3.11"
      - name: Bandit (code)
        if: hashFiles('**/*.py') != ''
        run: |
          pip install bandit
          bandit -r . -f json -o reports/bandit.json || true
      - name: Safety (deps)
        if: hashFiles('**/requirements.txt') != ''
        run: |
          pip install safety
          safety check -r requirements.txt --output json > reports/safety.json || true

      - name: truffleHog (secrets)
        uses: trufflesecurity/trufflehog@v3.81.10
        with:
          path: .
          extra_args: --json --no-verification
      - name: Save truffleHog report
        shell: bash
        run: |
          mkdir -p reports
          echo "See job logs for redacted findings" > reports/trufflehog.txt

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            reports/npm-audit.json
            reports/frontend-npm-audit.json
            reports/bandit.json
            reports/safety.json
            reports/trufflehog.txt
          if-no-files-found: ignore

